services:
  app:
    build:
      context: .
    image: daylog-web:latest
    container_name: daylog-app
    restart: unless-stopped
    # 기존 VPS와 동일한 네트워크 설정 (docs/00_VPS_공통_배포_가이드.md 3.3)
    network_mode: bridge
    # deploy-vps.yml 이 Actions secrets 로부터 이 파일을 생성한다
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3016:3000"
